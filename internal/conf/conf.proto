syntax = "proto3";

package kratos.api;

option go_package = "kratos-todo-service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
    Server server = 1;
    Data data = 2;
}

message Server {
    message GRPC {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }

    // http 服务的配置
    message HTTP {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }

    HTTP http = 1;
    GRPC grpc = 2;
}

message Data {
    // 数据库配置
    message Database {
        // Driver name registered with database/sql， e.g. "mysql"
        string driver = 1;
        // Driver-specific DSN. Keep credentials out of version control.
        string source = 2;
        // Log every generated statement. Development only.
        bool debug = 3;
        // Create or update tables from the ent schema on startup. 
        // Leave false in production and apply migration as a separate, revieweed step.
        bool auto_migrate = 4;
        // Maximum number of open connections to the database (0 = default 20).
        int32 max_open_conns = 5;
        // Maximum number of connections in the idle pool (0 = default 10).
        int32 max_idle_conns = 6;
        // Maximum amount of time a connection may be reused (0 = default 1h).
        google.protobuf.Duration conn_max_lifetime = 7;
    }

    message Redis{
        string network = 1;
        string addr = 2;
        google.protobuf.Duration read_timeout = 3;
        google.protobuf.Duration write_timeout = 4;
    }

    Database database = 1;
    Redis redis = 2;
}