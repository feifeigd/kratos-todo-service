syntax = "proto3";

package kratos.api;

option go_package = "kratos-todo-service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
    Server server = 1;
    Data data = 2;
}

message Server {
    message GRPC {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }

    // http 服务的配置
    message HTTP {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }

    HTTP http = 1;
    GRPC grpc = 2;
}

message Data {
    // 数据库配置
    message Database {
        // Driver name registered with database/sql， e.g. "mysql"
        string driver = 1;
        // Driver-specific DSN. Keep credentials out of version control.
        string source = 2;
        // Log every generated statement. Development only.
        bool debug = 3;
        // Create or update tables from the ent schema on startup. 
        // Leave false in production and apply migration as a separate, revieweed step.
        bool auto_migrate = 4;
    }

    Database database = 1;
}