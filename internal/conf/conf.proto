syntax = "proto3";

package kratos.api;

option go_package = "kratos-todo-service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
    Server server = 1;
    Data data = 2;
}

message Server {
    message GRPC {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }

    // http 服务的配置
    message HTTP {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }

    HTTP http = 1;
    GRPC grpc = 2;
}

message Data {
    
}