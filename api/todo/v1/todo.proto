syntax = "proto3";

package todo.v1;

// buf.yaml 中配置依赖项, 然后执行 buf dep update
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto"; // google.protobuf.Timestamp

option go_package = "kratos-todo-service/api/todo/v1;v1";

// TodoService provides a simple CRUD example for managing todo items.
// It demonstrates unary, server-streaming, and bidirectional-streaming RPCs
// together with AIP-style list filtering, ordering, and pagination.
service TodoService {
    rpc CreateTodo(CreateTodoRequest)returns(Todo){
        option(google.api.http)= {
            post: "v1/todos/create"
            body: "todo"
        };
    }
}

// TodoStatus is the lifecycle state of a todo item.
enum TodoStatus {
    // Default value. Never returned by the server.
    TODO_STATUS_UNSPECIFIED = 0;
    TODO_STATUS_ACTIVE = 1;
    // The item has been soft-deleted: the recore is retained by the server but no loger appears in GetTodo or ListTodos results.
    TODO_STATUS_DELETED = 2;
}

// Todo is the canonical representation of a todo item.
message Todo {
    // Application-generated UUIDv7 identifier. Read-only on create.
    string id = 1;
    // Short human-readable title.
    string title = 2;
    string content = 3;
    bool completed = 4;
    // Server-assigned, read-only
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
    TodoStatus status = 7;
}

// CreateTodoRequest is th input for TodoService.CreateTodo.
message CreateTodoRequest {
    // The todo item to create. The id, created_at, and updated_at fields are
    // ignored on input and populated by the server in the response.
    Todo todo = 1 [(google.api.field_behavior) = REQUIRED];
}
