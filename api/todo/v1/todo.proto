syntax = "proto3";

package todo.v1;

// buf.yaml 中配置依赖项, 然后执行 buf dep update
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto"; 
import "google/protobuf/timestamp.proto"; // google.protobuf.Timestamp

option go_package = "kratos-todo-service/api/todo/v1;v1";

// TodoService provides a simple CRUD example for managing todo items.
// It demonstrates unary, server-streaming, and bidirectional-streaming RPCs
// together with AIP-style list filtering, ordering, and pagination.
service TodoService {
    // CreateTodo creates a new todo item and returns the persisted record 
    // with the server-assigned id, created_at, and updated_at populated.
    // Returns INVALID_ARGUMENT if the request payload fails validation.
    rpc CreateTodo(CreateTodoRequest)returns(Todo){
        option(google.api.http)= {
            post: "v1/todos/create"
            body: "todo"
        };
    }

    // ListTodos returns a page of todo items, optionally filtered and ordered.
    // Use the next_page_token from TodoSet to retrieve subsequent pages.
    // Returns INVALID_ARGUMENT if filter, order_by, or page_token are malformed.
    rpc ListTodos(ListTodosRequest)returns (TodoSet){
        option(google.api.http)={
            get: "/v1/todos/list"
        };
    }

    // WatchTodos opens a server-side stream that emits a TodoEvent for every create, update, or delete that matches the supplied filter and ordering.
    // The streamremains open until the client cancels or the server terminates it.
    // NOTE: this static path must be registered before "/v1/todos/{id}",
    // otherwise the wildcard route shadows it (mux matches in declaration order).
    rpc WatchTodos(WatchTodosRequest)returns(stream TodoEvent){
        option(google.api.http)={
            get: "/v1/todos/watch"
        };
    }

    rpc GetTodo(GetTodoRequest)returns(Todo){
        option(google.api.http)={
            get: "/v1/todos/{id}"
        };
    }

    rpc UpdateTodo(UpdateTodoRequest)returns(Todo){
        option(google.api.http)={
            put: "/v1/todos/update"
            body: "todo"
        };
    }

    rpc DeleteTodo(DeleteTodoRequest)returns(google.protobuf.Empty){
        option(google.api.http)={
            delete: "v1/todos/{id}"
        };
    }

    // SyncTodos opens a bidirectional stream for two-way synchronization.
    // The client sends SyncTodoRequest message describing local changes,
    // and the server pushes back TodoEvent messages reflecting the resulting state.
    // The stream stays open until eigher side closes it.
    rpc SyncTodos(stream SyncTodoRequest)returns(stream TodoEvent){
        option(google.api.http) = {
            post: "/v1/todos/sync"
            body: "*"
        };
    }
}

// TodoStatus is the lifecycle state of a todo item.
enum TodoStatus {
    // Default value. Never returned by the server.
    TODO_STATUS_UNSPECIFIED = 0;
    TODO_STATUS_ACTIVE = 1;
    // The item has been soft-deleted: the recore is retained by the server but no loger appears in GetTodo or ListTodos results.
    TODO_STATUS_DELETED = 2;
}

// Todo is the canonical representation of a todo item.
message Todo {
    // Application-generated UUIDv7 identifier. Read-only on create.
    string id = 1;
    // Short human-readable title.
    string title = 2;
    string content = 3;
    bool completed = 4;
    // Server-assigned, read-only
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
    TodoStatus status = 7;
}

// TodoSet is a paginated collection of todo items returned by ListTodos.
message TodoSet{
    // The page of todo items in the order requested by ListTodosRequest.order_by.
    repeated Todo todos = 1;

    // Token used to retrieve the next page via ListTodosRequest.page_token.
    // Empty when there are no more results.
    string next_page_token = 2;
}

// CreateTodoRequest is th input for TodoService.CreateTodo.
message CreateTodoRequest {
    // The todo item to create. The id, created_at, and updated_at fields are
    // ignored on input and populated by the server in the response.
    Todo todo = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetTodoRequest {
    string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListTodosRequest {
    int32 page_size = 1;

    // Optional. Token from a previous response's next_page_token used to fetch the netx page.
    // Leave empty to request the first page.
    string page_token = 2;

    // Optional. The standare list filter.
    // Supported fields:
    //     * `title` (i.e. `title:"bug"`)
    //     * `content` (i.e. `content:"docs"`)
    //     * `completed` (i.e. `completed` or `NOT compoeted`)
    //     * `created_at` range (i.e. `created>="2026-01-01T00:00:00Z"`)
    string filter = 3;

    // Optional. A comma-separated list of fields to order by.
    // Supported fields:
    //     * `id`
    //     * `title`
    //     * `created_at`
    //     * `updated_at`
    // Append ` desc` to a field for descending order, e.g. `created_at desc`.
    // Defaults to ascending order when no direction is supplied.
    string order_by = 4;
}

message UpdateTodoRequest {
    // id 必填
    Todo todo = 1 [(google.api.field_behavior)=REQUIRED];

    // Set of field paths in todo to overwrite. 
    // Fields not listed are left unchanged.
    // Use a single path of `*` to replace every mutable field.
    google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior)=REQUIRED];
}

message DeleteTodoRequest {
    string id = 1 [(google.api.field_behavior)=REQUIRED];
}

message WatchTodosRequest {
    int32 page_size = 1;
    string page_token=2;
    // 与 ListTodosRequest.filter 相同语法
    string filter = 3;
    // 与 ListTodosRequest.order_by 相同语法
    string order_by = 4;
}

// SyncTodoRequest is a single client message in the SyncTodos bidirectional stream.
// The action field selects which operation to perform on the server.
message SyncTodoRequest {
    // The operation to perform. One of `create`, `update`, or `delete`.
    string action = 1;
    // Payload for `create` and `update` actions. Ignored for `delete`.
    Todo todo = 2;
    // Identifier of the target todo. Required for `delete` and `update`
    string id = 3;
    // Field mask used by `update` actions to limit which fields are overwritten.
    // Ignored for `create` and `delete`.
    google.protobuf.FieldMask update_mask = 4;
}

// TodoEvent is a server-sent message describing a chagne to a todo item.
// It is emitted by both WatchTodos and SyncTodos streams.
message TodoEvent {
    // The change that occurred. One of `created`, `updated`, or `deleted`.
    string action = 1;

    // The todo item after the change.
    // For `deleted` events only the id field is guaranteed to be populated.
    Todo todo = 2;
    google.protobuf.Timestamp event_time = 3;
}

